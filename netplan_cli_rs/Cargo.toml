[package]
name = "netplan"
version = "0.1.0"
edition = "2021"
description = "Minimal Rust reimplementation of the netplan CLI"

[[bin]]
name = "netplan"
path = "src/main.rs"

[dependencies]
clap    = { version = "4", features = ["derive"] }
anyhow  = "1"

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
