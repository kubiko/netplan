[package]
name = "netplan"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Minimal Rust reimplementation of the netplan CLI"

[[bin]]
name = "netplan"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = { version = "1", features = ["preserve_order"] }
glob = "0.3.3"
regex = "1.12.4"
log = "0.4.32"
env_logger = "0.11.10"
nix = { version = "0.31.3", features = ["fs"] }

[build-dependencies]
anyhow = "1"

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
