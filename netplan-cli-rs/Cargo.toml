[package]
name = "netplan"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Minimal Rust reimplementation of the netplan CLI"

[[bin]]
name = "netplan"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
anyhow = { version = "1", default-features = false, features = ["std"] }
serde_json = { version = "1", default-features = false, features = ["std", "preserve_order"] }
glob = { version = "0.3.3", default-features = false }
log = { version = "0.4.32", default-features = false, features = ["std"] }
env_logger = { version = "0.11.10", default-features = false }
nix = { version = "0.31.3", default-features = false, features = ["fs"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }

[build-dependencies]
anyhow = { version = "1", default-features = false, features = ["std"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
